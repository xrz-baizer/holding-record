<!doctype html>
<html lang="en" data-app="position-journal"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef2f7"><title>My holdings</title><link rel="stylesheet" href="css/styles.css?v=20261123-mobile-add-35"><link rel="stylesheet" href="css/mobile.css?v=20261123-mobile-add-35"><script defer src="js/core.js?v=20261123-mobile-add-35"></script><script defer src="js/i18n.js?v=20261123-mobile-add-35"></script><script defer src="js/app.js?v=20261123-mobile-add-35"></script><script defer src="js/mobile-drawer.js?v=20261123-mobile-add-35"></script></head>
<body>
<header id="phone-bar" hidden>
  <div class="phone-nav-row">
    <button id="drawer-toggle" type="button" aria-label="Menu" aria-haspopup="dialog" aria-controls="mobile-drawer" aria-expanded="false">
      <span class="menu-lines" aria-hidden="true"></span>
    </button>
    <div class="phone-stock-label"><strong id="phone-stock-name">My holdings</strong><span id="phone-stock-code" hidden></span></div>
    <span id="phone-page-count" hidden></span>
  </div>
</header>
<main class="app-shell">
<aside class="summary-sidebar"><header class="sidebar-heading"><h1 id="sidebar-title" tabindex="-1">My holdings</h1><span id="save-status" role="status">Loading</span><button type="button" id="drawer-close" hidden aria-label="Close">×</button></header><section id="overview" class="overview" aria-label="Portfolio summary"></section><nav class="tools"><button class="primary" data-action="add-stock">＋ Add stock</button><div id="mobile-stock-tools" hidden><button type="button" data-action="edit-stock"></button><button type="button" data-action="history"></button></div><button data-action="settings">Fees</button><button data-action="export">Export</button><button data-action="import">Import</button><button class="danger-text" data-action="clear">Clear</button></nav><button class="font-size-button" id="font-size-button" data-action="font-size">Font 100%</button><button class="theme-button" id="theme-button" data-action="theme" aria-pressed="false">Theme · Light</button><button class="language-button" id="language-button" data-action="language">Language · English</button></aside>
<section id="stocks" aria-label="Stocks and trading lots"></section>
</main><dialog id="mobile-drawer" aria-labelledby="sidebar-title"></dialog><dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog><input id="import-file" type="file" accept=".json,application/json" hidden><div id="toast" role="status" aria-live="polite"></div></body></html>
