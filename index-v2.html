<!doctype html>
<html lang="en" data-app="position-journal" class="journal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>My holdings</title>
  <link rel="stylesheet" href="css/styles.css?v=20261123-quote-button-red">
  <link rel="stylesheet" href="css/mobile.css?v=20261123-quote-button-red">
  <script defer src="js/core.js?v=20261123-quote-button-red"></script>
  <script defer src="js/i18n.js?v=20261123-quote-button-red"></script>
  <script defer src="js/app.js?v=20261123-quote-button-red"></script>
  <style>
    .journal {
      --ground: #f5f5f7; --surface: #fff; --subtle: #f8f9fb; --ink: #1d1d1f;
      --quiet: #626268; --hairline: rgba(0,0,0,.09); --accent: #0071e3;
      --frost: rgba(252,253,255,.78); --edge-light: rgba(255,255,255,.86);
      --depth: 0 1px 3px rgba(0,0,0,.05), 0 14px 40px rgba(0,0,0,.05);
      --ease-spring: cubic-bezier(.32,.72,0,1); font-optical-sizing: auto;
      --book: #67829e;
      height: auto; overflow: auto; color-scheme: light;
    }
    .journal[data-theme=dark] {
      --ground: #17181b; --surface: #242528; --subtle: #2b2c30; --ink: #f5f5f7;
      --quiet: #b6b8c1; --hairline: #404248; --accent: #9ac8ff;
      --frost: rgba(44,46,52,.82); --edge-light: rgba(255,255,255,.17);
      --depth: 0 1px 3px #0002, 0 12px 30px #0003;
      --book: #a7c0da; color-scheme: dark;
    }
    .journal body {
      height: auto; min-height: 100svh; overflow: visible; color: var(--ink);
      background: var(--ground);
      font-family: -apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    }
    .journal .app-shell {
      display: block; position: relative; width: min(100%, 86rem); height: auto;
      min-height: 100svh; margin: auto; padding: 1rem clamp(.75rem,3vw,2.6rem) 3rem;
    }
    .journal .summary-sidebar { display: contents; }
    .command-bar, .journal #modal, .tool-menu {
      background: var(--surface); border: 1px solid var(--edge-light); box-shadow: var(--depth);
    }
    @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
      .command-bar, .journal #modal, .tool-menu {
        background: var(--frost); -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
      }
    }
    .command-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: .5rem;
      padding: .38rem .55rem .38rem .9rem; border-radius: 1.3rem;
      position: sticky; top: max(.4rem,env(safe-area-inset-top)); z-index: 8;
    }
    .brand {display: inline-flex; align-items:center; gap:.55rem; margin-right:auto; font-size:.9rem; font-weight:650; letter-spacing:-.025em}
    .book-mark {display:inline-block;width:1.12rem;height:1.32rem;border:1.5px solid currentColor;border-radius:.22rem;border-left-width:.28rem;position:relative;color:var(--book)}
    .book-mark::after {content:"";position:absolute;top:.33rem;left:.18rem;right:.13rem;height:1px;background:currentColor;box-shadow:0 .22rem currentColor}
    .journal:lang(en) [lang=zh-CN], .journal:lang(zh-CN) [lang=en] {display:none}
    .command-bar button, .command-bar summary {min-height:44px;font-size:.83rem;font-weight:550;line-height:1.2}
    .journal .command-bar .primary, .journal .empty .primary {
      color:white!important;background:#0071e3;border:0;border-radius:999px;box-shadow:none;padding:.55rem 1rem;
    }
    .journal .command-bar .primary:hover, .journal .empty .primary:hover {background:#005cb5}
    .command-bar details {position:relative}
    .command-bar summary {display:flex;align-items:center;gap:.45rem;padding:.5rem .75rem;cursor:pointer;border-radius:999px;color:var(--ink);list-style:none}
    .command-bar summary::-webkit-details-marker {display:none}
    .command-bar summary::after {content:"";width:.35rem;height:.35rem;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin-top:-.15rem}
    .command-bar details[open] summary, .command-bar summary:hover {background:var(--subtle)}
    .tool-menu {position:absolute;right:0;top:calc(100% + .65rem);width:min(14rem,84vw);max-height:calc(100dvh - 5rem);overflow-y:auto;overscroll-behavior:contain;padding:.4rem;border-radius:1rem}
    .journal .tool-menu button {display:block;text-align:start;width:100%;margin:0;border:0;border-radius:.55rem;color:var(--ink)!important;background:none;box-shadow:none;padding:.6rem .85rem}
    .journal .tool-menu button:hover {background:var(--subtle)}
    .journal .tool-menu .danger-text {color:var(--red)!important}
    .menu-group + .menu-group {border-top:1px solid var(--hairline);margin-top:.25rem;padding-top:.25rem}
    .masthead {display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.25rem 2rem;padding:clamp(2rem,5vw,4rem) .35rem clamp(1.5rem,4vw,2.75rem)}
    .journal .sidebar-heading {display:flex;flex-direction:column;align-items:flex-start;gap:.45rem;margin:0}
    .journal .sidebar-heading h1 {margin:0;font-size:clamp(2rem,4.2vw,3.4rem);letter-spacing:-.055em;line-height:1.12;color:var(--ink)}
    .journal #save-status {color:var(--quiet);font-size:.75rem}
    .journal #overview {display:flex;flex-wrap:wrap;gap:1rem 2rem;width:auto;margin:0;padding:0;border:none;background:none;box-shadow:none}
    .journal #overview>div {padding:0;margin:0;border:0;background:none}
    .journal #overview>div+div {padding-left:1.5rem;border-left:1px solid var(--hairline)}
    .journal #overview strong {font-size:clamp(1.45rem,2.7vw,2.45rem);letter-spacing:-.045em;line-height:1.25;font-variant-numeric:tabular-nums}
    .journal #overview .overview-heading {justify-content:flex-start;gap:.5rem}
    .journal #overview .overview-heading b {font-size:.85rem;margin:0}
    .journal #overview span {color:var(--quiet)}
    .journal #overview>div:last-child strong {color:var(--ink)}
    .journal #stocks {display:block;height:auto;min-height:0;padding:0;overflow:visible;background:var(--surface);border:1px solid var(--hairline);border-radius:1.3rem;box-shadow:var(--depth)}
    .journal #stocks .stock-grid {margin:0;border:0;box-shadow:none;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0;overflow:visible;height:auto;min-height:0}
    .journal #stocks .stock-grid+.stock-grid {border-top:1px solid var(--hairline)}
    .journal #stocks .stock-grid:first-child {border-radius:1.3rem 1.3rem 0 0}
    .journal #stocks .stock-grid:last-child {border-radius:0 0 1.3rem 1.3rem}
    .journal #stocks :is(.base-panel,.operation-panel,.mobile-panel,.table-header,.table-wrap,.table-footer) {
      background:transparent;box-shadow:none;border-color:var(--hairline);backdrop-filter:none;-webkit-backdrop-filter:none;
    }
    .journal #stocks .stock-name-line h2 {font-size:1.35rem;letter-spacing:-.035em;color:var(--ink)}
    .journal #stocks .position-metrics dt, .journal #stocks .mobile-capacity {color:var(--quiet)}
    .journal #stocks .position-emphasis dd, .journal #stocks .market-value dd {color:var(--ink)}
    .journal #stocks .table-header, .journal #stocks .table-footer {background:var(--subtle)}
    .journal #stocks .empty {display:grid;place-content:center;justify-items:center;gap:.8rem;min-height:14rem;padding:2rem;margin:0;border:0;background:none;color:var(--ink);box-shadow:none}
    .journal #stocks .empty::before {content:"";width:2.15rem;height:2.5rem;border:2px solid var(--book);border-left-width:.4rem;border-radius:.36rem;background:repeating-linear-gradient(to bottom,transparent 0 .36rem,var(--hairline) .36rem .43rem) center/56% 48% no-repeat}
    .journal #stocks .empty p {font-size:1.15rem;font-weight:600;letter-spacing:-.025em;margin:0}
    .journal #modal {color:var(--ink);border-radius:1.25rem}
    .journal :is(button,summary,input):focus-visible {outline:3px solid var(--accent);outline-offset:2px}
    @media(min-width:951px) {
      .journal #stocks .stock-grid {grid-template-columns:minmax(12rem,24%) minmax(0,1fr) minmax(7.8rem,12%);padding:.85rem .4rem}
      .journal #stocks .base-panel,.journal #stocks .operation-panel {padding:.5rem .9rem}
      .journal #stocks .mobile-panel {height:auto;max-height:none;padding:.5rem .85rem}
      .journal #stocks .table-wrap {flex:1 1 auto;max-height:17rem}
    }
    @media(max-width:950px) and (min-width:761px) and (pointer:fine) {
      .journal #stocks .stock-grid {grid-template-columns:minmax(0,1fr) minmax(8rem,22%)}
      .journal #stocks .base-panel {grid-area:1/1}
      .journal #stocks .operation-panel {grid-area:1/2}
      .journal #stocks .mobile-panel {grid-area:2/1/3/3;height:auto;max-height:none}
      .journal #stocks .table-wrap {flex:1 1 auto;max-height:16rem}
    }
    @media(max-width:760px),(max-width:950px) and (pointer:coarse) {
      .journal #stocks .stock-grid {grid-template-columns:minmax(0,1fr)}
      .journal #overview {gap:1rem}
      .journal #overview>div+div {padding-left:1rem}
      .journal .masthead {display:grid;gap:1.1rem}
      .journal .command-bar {padding-left:.65rem;gap:.15rem}
      .journal .command-bar .primary {padding:.5rem .65rem}
      .journal .command-bar summary {padding:.5rem}
    }
    .journal .command-bar button:active:not(:disabled), .journal summary:active {transform:scale(.97)}
    .journal #modal {box-shadow:0 2px 8px #0002,0 30px 80px #0003}
    @media(prefers-reduced-motion:no-preference) {
      .journal #modal {
        transition:opacity .28s var(--ease-spring),transform .28s var(--ease-spring),
                   display .28s allow-discrete,overlay .28s allow-discrete;
      }
      .journal #modal:not([open]) {opacity:0;transform:translateY(.4rem) scale(.985)}
      @starting-style {
        .journal #modal[open] {opacity:0;transform:translateY(.4rem) scale(.985)}
      }
    }
    @media(prefers-reduced-transparency:reduce),(prefers-contrast:more) {
      .journal :is(.command-bar,#modal,.tool-menu) {background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none;border-color:var(--hairline)}
    }
    @media(prefers-reduced-motion:reduce) {
      .journal *, .journal *::after {animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="summary-sidebar">
      <div class="command-bar">
        <div class="brand"><i class="book-mark" aria-hidden="true"></i><span lang="zh-CN">持仓手记</span><span lang="en">Holdings Journal</span></div>
        <button class="primary" data-action="add-stock">＋ Add stock</button>
        <details id="tools-menu">
          <summary><span lang="zh-CN">工具</span><span lang="en">Tools</span></summary>
          <div class="tool-menu">
            <div class="menu-group">
              <button data-action="settings">Fees</button>
              <button data-action="export">Export</button>
              <button data-action="import">Import</button>
            </div>
            <div class="menu-group">
              <button id="font-size-button" data-action="font-size">Font</button>
              <button id="theme-button" data-action="theme">Theme</button>
              <button id="language-button" data-action="language">Language</button>
            </div>
            <div class="menu-group"><button class="danger-text" data-action="clear">Clear</button></div>
          </div>
        </details>
      </div>
      <div class="masthead">
        <div class="sidebar-heading"><h1>My holdings</h1><span id="save-status" role="status">Loading</span></div>
        <section id="overview" class="overview" aria-label="Portfolio summary"></section>
      </div>
    </header>
    <section id="stocks" aria-label="Stocks and trading lots"></section>
  </main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    const toolsMenu = document.querySelector('#tools-menu');
    document.addEventListener('click', event => {
      if (!toolsMenu.open) return;
      const picked = event.target.closest('#tools-menu button');
      if (picked || !toolsMenu.contains(event.target)) toolsMenu.open = false;
      if (picked) toolsMenu.querySelector('summary').focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && toolsMenu.open) {
        toolsMenu.open = false;
        toolsMenu.querySelector('summary').focus();
      }
    });
  </script>
</body>
</html>
